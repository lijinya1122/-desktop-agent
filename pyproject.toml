[project]
name = "desktop-agent"
version = "1.0.0"
description = "Mini Cursor：一个能双击打开的桌面编程智能体（四个工具 + MCP）"
requires-python = ">=3.9"
# 版本钉死，别用 latest —— 打包出来换台机器要能复现
dependencies = [
    "fastapi==0.128.8",
    "uvicorn==0.34.0",
    "httpx==0.28.1",
    "python-dotenv==1.0.1",
    "pywebview==5.3.2",
    "websockets==14.1",
]

[project.optional-dependencies]
build = ["pyinstaller==6.11.1"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent*", "server*"]
